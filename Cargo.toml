[package]
name = "rust_weather_ml"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A production-grade machine learning system for weather prediction built entirely in Rust"
license = "MIT"
repository = "https://github.com/yourusername/RustForMachineLearning"
keywords = ["machine-learning", "weather", "rust", "prediction"]
categories = ["science", "algorithms"]

[lib]
name = "rust_weather_ml"
path = "src/lib.rs"

[[bin]]
name = "daily_predictions"
path = "src/bin/daily_predictions.rs"

[dependencies]
# ML Libraries
linfa = "0.7"
linfa-trees = "0.7"
linfa-linear = "0.7"
linfa-logistic = "0.7"
linfa-preprocessing = "0.7"
smartcore = "0.3"
# burn = "0.13"  # Uncomment when implementing neural networks

# Data handling
polars = { version = "0.46", features = ["lazy", "parquet", "csv", "json", "dtype-datetime", "dtype-duration"] }
ndarray = { version = "0.16", features = ["serde"] }
ndarray-stats = "0.6"

# API & Serialization
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"

# Visualization
plotters = "0.3"

# Statistics
statrs = "0.18"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.0"

[profile.release]
opt-level = 3
lto = true

[features]
default = []
neural = []  # Enable neural network support with Burn
