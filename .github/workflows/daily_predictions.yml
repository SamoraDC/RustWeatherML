name: Daily Weather Predictions

on:
  schedule:
    # Runs every day at 06:00 UTC.
    - cron: '0 6 * * *'
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-predictions
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  predict:
    name: Run daily predictions
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Write access is required to push the README update back.
          persist-credentials: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Verify model artifacts are present
        run: |
          set -e
          for f in \
            models/scaler.json \
            models/ridge_manual.json \
            models/rain_rf_model.bin \
            models/climatology.json \
            models/production_contract.json \
            models/golden_test.json \
          ; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
          done
          echo "All production artifacts present."

      - name: Golden equivalence test (src/ vs notebook 05)
        run: cargo test --release --test integration_loadmodel -- --nocapture

      - name: Build release binary
        run: cargo build --release --bin daily_predictions

      - name: Run daily predictions
        run: ./target/release/daily_predictions

      - name: Commit updated README and report
        run: |
          git config user.name  "rust-weather-ml-bot"
          git config user.email "actions@github.com"
          git add README.md data/predictions/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "daily: weather predictions $(date -u +%F)"
            git push
          fi
